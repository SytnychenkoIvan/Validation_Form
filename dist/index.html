<!DOCTYPE html>
<html lang="en">

<head>
	<title>Form Validation</title>
	<meta charset="UTF-8">
	<meta name="format-detection" content="telephone=no">
	<!-- <style>body{opacity: 0;}</style> -->
	<link rel="stylesheet" href="css/style.min.css?_v=20260414212608">
	<link rel="shortcut icon" href="favicon.ico">
	<!-- <meta name="robots" content="noindex, nofollow"> -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<div class="wrapper">

		<main class="page">
			<form action="#" id="form" class="form">
				<h1 class="form__title">Форма</h1>
				<div class="form__item">
					<label for="name" class="form__label">Ім'я</label>
					<input type="text" id="name" autocomplete="on" class="form__input">
				</div>
				<div class="form__item">
					<label for="email" class="form__label">Email</label>
					<input type="email" id="email" autocomplete="on" class="form__input">
				</div>
				<div class="form__item">
					<label for="password" class="form__label">Password</label>
					<input type="password" id="password" autocomplete="on" class="form__input">
				</div>
				<button type="submit" class="button">Send</button>
			</form>
		</main>

	</div>
	<script src="js/app.min.js?_v=20260414212608"></script>
</body>

</html>
